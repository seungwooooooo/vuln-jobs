  <style>
    :root {
      --bg: #f5f5f7;
      --card-bg: #ffffff;
      --text: #1d1d1f;
      --text-muted: #86868b;
      --primary: #0071e3;
      --primary-hover: #0077ed;
      --accent: #ff2d55;
      --border: rgba(0, 0, 0, 0.08);
      --card-border: rgba(0, 0, 0, 0.05);
      --card-shadow: 0 2px 10px rgba(0, 0, 0, 0.03), 0 1px 3px rgba(0, 0, 0, 0.02);
      --badge-bg: #f5f5f7;
      --badge-text: #515154;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #000000;
        --card-bg: #1c1c1e;
        --text: #f5f5f7;
        --text-muted: #86868b;
        --primary: #2997ff;
        --primary-hover: #47a6ff;
        --accent: #ff375f;
        --border: rgba(255, 255, 255, 0.12);
        --card-border: rgba(255, 255, 255, 0.08);
        --card-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
        --badge-bg: #2c2c2e;
        --badge-text: #aeaeb2;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.47059;
      letter-spacing: -0.016em;
      padding: 24px 16px;
      max-width: 860px;
      margin: 0 auto;
      -webkit-font-smoothing: antialiased;
    }
    header {
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.025em;
      color: var(--text);
    }
    .meta {
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .stats-bar {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      margin-bottom: 20px;
    }
    .stat-pill {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      box-shadow: var(--card-shadow);
      border-radius: 14px;
      padding: 12px 14px;
      text-align: left;
      font-size: 0.82rem;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      gap: 2px;
      cursor: pointer;
      transition: all 0.15s ease;
      user-select: none;
    }
    .stat-pill:active {
      transform: scale(0.97);
    }
    .stat-pill.active {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px var(--primary);
    }
    .stat-pill strong {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--primary);
      letter-spacing: -0.02em;
    }
    .search-box {
      width: 100%;
      padding: 14px 18px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-size: 1rem;
      margin-bottom: 20px;
      outline: none;

    }

      border: 1px solid var(--card-border);
      box-shadow: var(--card-shadow);
      border-radius: 16px;
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .job-card:active {
      transform: scale(0.995);
    }
    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .company {
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--primary);
      letter-spacing: -0.01em;
    }
    .company small {
      color: var(--text-muted);
      font-weight: 400;
      margin-left: 4px;
    }
    .badge {

      padding: 3px 8px;
      border-radius: 6px;
      background: var(--badge-bg);
      color: var(--badge-text);
      font-weight: 500;
      white-space: nowrap;

      color: #e00034;
      font-weight: 600;
    }
    .badge.urgent {

      color: #c96200;
      font-weight: 600;
    }

        color: #ff6482;
      }
      .badge.urgent {
        background: rgba(255, 159, 10, 0.18);
        color: #ffb340;
      }
    }
    .title {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text);
      text-decoration: none;
      line-height: 1.42;
      letter-spacing: -0.015em;

    .title:hover {
      color: var(--primary);
    }

      justify-content: space-between;
      align-items: center;
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-top: 4px;
      gap: 10px;
    }
    .details {

      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }
    .details span {
      background: var(--badge-bg);
      color: var(--badge-text);
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 0.78rem;
    }
    .apply-btn {
      background: var(--primary);
      color: #ffffff;
      font-weight: 600;
      text-decoration: none;
      padding: 7px 16px;
      border-radius: 20px;
      font-size: 0.82rem;
      letter-spacing: -0.01em;
      white-space: nowrap;
      transition: background 0.15s ease;
    }
    .apply-btn:hover {
      background: var(--primary-hover);
    }
    .more-btn {

      padding: 14px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--primary);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
      transition: all 0.15s ease;
    }
    .more-btn:hover {
      background: rgba(0, 113, 227, 0.05);
    }

        const plat = escapeHtml(item['플랫폼'] || '');
        const exp = escapeHtml(item['경력 요건'] || '경력무관');
        const loc = escapeHtml(item['근무지역'] || '서울');
        const deadline = escapeHtml(item['마감일'] || item['D-day'] || '상시');

        return `
          <div class="job-card">
            <div class="card-top">
              <span class="company">${comp} · <small style="color:var(--text-muted);">${plat}</small></span>
              <span class="${badgeClass}">${badgeText}</span>
            </div>
            <a href="${url}" target="_blank" rel="noopener noreferrer" class="title">${title}</a>
            <div class="card-bottom">
              <div class="details">
                <span>📍 ${loc}</span>
                <span>💼 ${exp}</span>
                <span>📅 ${deadline}</span>
              </div>
              <a href="${url}" target="_blank" rel="noopener noreferrer" class="apply-btn">지원하기</a>
            </div>
          </div>
        `;
      }).join('');

      if (filteredJobs.length > displayLimit) {
        moreBtn.style.display = 'block';
        moreBtn.innerText = `더보기 (현재 ${displayLimit} / 총 ${filteredJobs.length.toLocaleString()}건)`;
      } else {
        moreBtn.style.display = 'none';
      }
    }

    function loadMore() {
      displayLimit += 50;
      render();
    }

    render();

    searchInput.addEventListener('input', () => {
      applyFilterAndSearch();
    });
  </script>
</body>
</html>
