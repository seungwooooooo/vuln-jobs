  <style>
    :root {

      --primary: #38bdf8;

      --border: #334155;

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {

      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 16px;
      max-width: 900px;
      margin: 0 auto;
    }
    header {
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }
    h1 { font-size: 1.4rem; font-weight: 700; color: var(--primary); margin-bottom: 6px; }
    .meta { font-size: 0.85rem; color: var(--text-muted); display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    .search-box {

      padding: 12px 16px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 1rem;
      margin-bottom: 16px;
      outline: none;
    }
    .search-box:focus { border-color: var(--primary); ring: 2px var(--primary); }
    .stats-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
    }
    .stat-pill {
      flex: 1;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      text-align: center;
      font-size: 0.85rem;
    }
    .stat-pill strong { display: block; font-size: 1.1rem; color: var(--primary); margin-top: 2px; }
    .btn-link {
      display: inline-block;
      background: #0284c7;
      color: white;
      text-decoration: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
    }
    .job-list { display: flex; flex-direction: column; gap: 12px; }
    .job-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: transform 0.1s ease;
    }
    .job-card:active { transform: scale(0.99); }
    .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .company { font-size: 0.9rem; font-weight: 600; color: #38bdf8; }
    .badge {
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 4px;
      background: var(--badge-bg);
      color: var(--text-muted);
      white-space: nowrap;
    }
    .badge.new { background: rgba(244, 63, 94, 0.2); color: #fda4af; font-weight: 600; }
    .badge.urgent { background: rgba(234, 179, 8, 0.2); color: #fde047; font-weight: 600; }
    .title {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text);
      text-decoration: none;
      line-height: 1.4;
    }
    .title:hover { color: var(--primary); }
    .card-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 4px;
    }
    .details { display: flex; gap: 8px; flex-wrap: wrap; }
    .apply-btn {
      background: var(--primary);
      color: #0f172a;
      font-weight: 700;
      text-decoration: none;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 0.85rem;
      white-space: nowrap;
    }
